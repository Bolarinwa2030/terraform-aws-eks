apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: invetory-service
          image: 071680046254.dkr.ecr.us-east-1.amazonaws.com/inventory-service:8da62c02c646511b29f77ee13d10acb5ebdd1eac
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
            readinessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 10
              periodSeconds: 15
            livenessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 15
              periodSeconds: 20


