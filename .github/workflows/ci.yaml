name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/**/deployment.yaml'
      - 'apps/**/*.yaml'  # TO avoid looping
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, api-gateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt

      - name: Run basic test
        run: |
          cd services/${{ matrix.service }}
          python -c "import app; print('Import OK')"

  build-and-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest
    needs: test
    if: "!contains(github.event.head_commit.message, 'ci: update')"
    strategy:
      matrix:
        service: [order-service, inventory-service, api-gateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest \
            services/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest

      - name: Update image tag in GitOps repo
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ github.repository_owner }}/terraform-aws-eks.git gitops-repo

          cd gitops-repo

          sed -i "s|image:.*|image: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}|g" \
            apps/${{ matrix.service }}/dev/deployment.yaml

          git add .
          git diff --staged --quiet || git commit -m "ci: update ${{ matrix.service }} image to ${{ github.sha }}"
          git push
